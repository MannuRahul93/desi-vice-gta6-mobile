name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies & Sync Assets
        run: |
          npm install
          mkdir -p www
          cp -r index.html style.css manifest.json js www/
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesiVice-GTA6-Mobile-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK Download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./DesiVice-GTA6-Mobile.apk
          gh release delete v1.0.0 --yes || true
          gh release create v1.0.0 ./DesiVice-GTA6-Mobile.apk \
            --title "Desi Vice Mobile v1.0 (GTA 6 Mobile APK)" \
            --notes "### 🚗 Desi Vice: Mobile (GTA 6 Style Open World Action)
            
            Download and install this APK directly on your Android mobile device!
            - Optimized for low-spec Android phones (2GB+ RAM)
            - 60 FPS smooth gameplay
            - Hindi and English bilingual support
            - Third person character, sports cars, police chases, and stunt ramps"
